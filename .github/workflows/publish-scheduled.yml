name: Instagram Scheduled Publisher

# Automatically publishes scheduled Instagram posts via GitHub Actions.
# Runs every 15 minutes — posts publish within ~15 min of their scheduled time.
#
# FREE TIER USAGE:
#   Public repos  → unlimited minutes (recommended)
#   Private repos → 2,000 min/month; change cron to '*/30 * * * *' to stay within limit
#
# REQUIRED SECRETS (set in GitHub repo → Settings → Secrets → Actions):
#   SUPABASE_URL         — your Supabase project URL
#   SUPABASE_SERVICE_KEY — your Supabase service role key

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish scheduled posts
        run: node scripts/publish-scheduled.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
