name: Instagram Scheduled Publisher

# Backup publisher for scheduled Instagram posts; the Worker's cron is the main one.
# Asks for a run every 15 minutes, off the top of the hour as GitHub advises, but GitHub
# starts scheduled runs late when it is busy (often by hours) and sometimes skips them.
#
# FREE TIER USAGE:
#   Public repos  - unlimited minutes (recommended)
#   Private repos - 2,000 min/month; change cron to '*/30 * * * *' to stay within limit
#
# REQUIRED SECRETS (set in GitHub repo, Settings, Secrets, Actions):
#   SUPABASE_URL         - your Supabase project URL
#   SUPABASE_SERVICE_KEY - a Supabase secret key (sb_secret_...) or the legacy service_role key
#
# Step-by-step setup with direct links: Settings, Scheduled publishing in the app,
# or docs/workflows/SCHEDULING_SETUP.md

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

# one run at a time; a run that starts while another is busy waits instead of cancelling it
concurrency:
  group: publish-scheduled
  cancel-in-progress: false

# the GITHUB_TOKEN only reads the repository; the publisher reaches Supabase and Instagram with its own secrets
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # under the 20 minute claim lease, so a later run never takes over a post this run is still publishing
    timeout-minutes: 14
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Publish scheduled posts
        run: node scripts/publish-scheduled.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
