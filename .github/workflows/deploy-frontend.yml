name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Cloudflare Pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # one install at the root covers every workspace, including wrangler
      - name: Install dependencies
        # npm skips an optional package it fails to download, so a missing platform binary gets one more install
        run: |
          npm ci
          if ! node scripts/check-platform-packages.ts; then
            echo "::warning::npm skipped a platform package; installing again"
            npm ci
            node scripts/check-platform-packages.ts
          fi

      # deploy only code that type-checks; Wrangler and Vite strip types without checking them
      - name: Type check
        run: npm run typecheck --workspace frontend

      - name: Test
        run: npm test --workspace frontend

      - name: Build
        run: npm run build --workspace frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_ADMIN_EMAIL: ${{ secrets.VITE_ADMIN_EMAIL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=twiligent --commit-dirty=true
          workingDirectory: frontend
