name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tsconfig.base.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Cloudflare Pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # one install at the root covers every workspace, including wrangler
      - name: Install dependencies
        # npm skips an optional package it fails to download, so a missing platform binary gets one more install
        run: |
          npm ci
          if ! node scripts/check-platform-packages.ts; then
            echo "::warning::npm skipped a platform package; installing again"
            npm ci
            node scripts/check-platform-packages.ts
          fi

      - name: Type check
        run: npm run typecheck --workspace site

      - name: Test
        run: npm test --workspace site

      # the site needs no secrets: every value it shows is public
      - name: Build
        run: npm run build --workspace site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=twiligent-site --commit-dirty=true
          workingDirectory: site
