name: CI

# Checks every pull request and every branch push before it can reach main and deploy.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    name: Type check, lint, test, build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # npm skips an optional package it fails to download, so a missing platform binary gets one more install
        run: |
          npm ci
          if ! node scripts/check-platform-packages.ts; then
            echo "::warning::npm skipped a platform package; installing again"
            npm ci
            node scripts/check-platform-packages.ts
          fi

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Bundle Worker
        run: npx wrangler deploy --dry-run --outdir dist
        working-directory: backend
